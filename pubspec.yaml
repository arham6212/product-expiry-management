name: product_expiry_management
description: Expiry-date tracking and action management for small retailers.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_image_compress: ^2.5.1
  http: ^1.6.0
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - shorebird.yaml
  uses-material-design: true
